services:
  backend:
    build: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-local-development-key}
      DATABASE_PATH: /app/data/students.db
      UPLOAD_FOLDER: /app/uploads
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - student_data:/app/data
      - student_uploads:/app/uploads
    ports:
      - "5001:5001"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
volumes:
  student_data:
  student_uploads:
